<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit de Mídia - Techfix</title>
  <style>
    /* Reset e Regra de Ouro para Imagens */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f4f4f9; color: #333; line-height: 1.6; }
    
    /* IMPEDE QUALQUER IMAGEM DE VAZAR NA TELA */
    img { max-width: 100%; height: auto; display: block; }

    /* Cabeçalho Alinhado */
    header {
      background: #111;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    header nav a { color: #fff; margin-left: 1rem; text-decoration: none; }

    /* Container Principal */
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    
    /* Hero / Capa com Tamanho Limitado */
    .hero { text-align: center; margin-bottom: 2rem; }
    .hero img { max-width: 400px; margin: 0 auto 1rem auto; border-radius: 8px; }

    /* Grid de Artes */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .card { background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn {
      display: inline-block;
      background: #007bff;
      color: #fff;
      padding: 0.5rem 1rem;
      text-decoration: none;
      border-radius: 4px;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <h2>Techfix</h2>
    <nav>
      <a href="#artes">Artes</a>
      <a href="#orientacoes">Orientações</a>
    </nav>
  </header>

  <div class="container">
    <section class="hero">
      <!-- TROQUE AQUI PELA SUA IMAGEM DE CAPA -->
      <img src="URL_DA_SUA_IMAGEM_DE_CAPA.png" alt="Kit de Mídia Techfix">
      <h1>Kit de Mídia - Techfix</h1>
      <p>Material de divulgação para redes sociais e WhatsApp</p>
    </section>

    <section id="artes">
      <h2>Biblioteca Visual</h2>
      <div class="grid">
        <!-- Exemplo de Card de Arte -->
        <div class="card">
          <img src="URL_DA_ARTE_1.png" alt="Arte CFTV">
          <h3>CFTV e Segurança</h3>
          <a href="URL_DA_ARTE_1.png" download class="btn">Baixar PNG</a>
        </div>
        <!-- Repita o .card para as outras artes -->
      </div>
    </section>
  </div>

</body>
</html>
